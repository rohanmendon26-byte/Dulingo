      <ellipse cx="60" cy="52" rx="42" ry="40" fill="#fff" stroke="#4c1d95" stroke-width="3" />
    </g>
    <!-- Eyes -->
    <ellipse cx="44" cy="46" rx="9" ry="11" fill="#fff" stroke="#1e1b3a" stroke-width="2" />
    <ellipse cx="76" cy="46" rx="9" ry="11" fill="#fff" stroke="#1e1b3a" stroke-width="2" />
    <circle cx="46" cy="48" r="5" fill="#1e1b3a" />
